<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spleeter WASM Smoke Test</title>
  </head>
  <body>
    <h1>Spleeter WASM Smoke Test</h1>
    <div>
      <input id="fileInput" type="file" accept="audio/*" />
      <button id="cancelBtn" disabled>Cancel</button>
      <button id="startBtn" disabled>Start Separation</button>
    </div>
    <div style="margin-top: 8px">
      <label for="stemsSelect">Stems:</label>
      <select id="stemsSelect">
        <option value="2" selected>2 stems</option>
        <option value="4">4 stems</option>
        <option value="5">5 stems</option>
      </select>
      <button id="loadModelBtn">Load Model</button>
      <button id="preloadAllBtn">Preload All</button>
      <span id="gpuStatus" style="margin-left: 12px; color: #666"
        >GPU: checking…</span
      >
      <span id="backendStatus" style="margin-left: 12px; color: #666"
        >Backend: —</span
      >
      <span id="glInfo" style="margin-left: 12px; color: #666"
        >GL: —</span
      >
      <span id="windowInfo" style="margin-left: 12px; color: #666"
        >Window: —</span
      >
      <label style="margin-left: 12px"
        ><input id="forceCpuChk" type="checkbox" /> Force CPU</label
      >
      <label style="margin-left: 12px"
        ><input type="checkbox" id="verboseChk" /> Verbose logs</label
      >
      <label style="margin-left: 12px"
        >Chunk (s):
        <input
          id="chunkSec"
          type="number"
          min="2"
          max="20"
          value="30"
          style="width: 60px"
          <label
            >WebGL tuning:
            <select id="webglTuning" style="width: 160px">
              <option value="default" selected>Default</option>
              <option value="v2_pack">WebGL2 + PACK</option>
              <option value="v2_f16">WebGL2 + F16</option>
              <option value="v1_pack">WebGL1 + PACK</option>
            </select>
          </label>
          <button id="applyTuningBtn" style="margin-left: 6px">Apply</button>
      /></label>
      <button id="setIdealBtn" style="margin-left: 8px">Use Ideal</button>
      <label style="margin-left: 12px"
        >Progress ms:
        <input
          id="progressMs"
          type="number"
          min="100"
          max="2000"
          value="250"
          style="width: 70px"
      /></label>
      <label style="margin-left: 12px"
        >Batch:
        <select id="batchSize" style="width: 80px">
          <option value="auto">auto</option>
          <option value="1" selected>1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <span
        style="
          margin-left: 12px;
          border-left: 1px solid #ccc;
          padding-left: 12px;
        "
      >
        <label
          >Overlap %:
          <input
            id="overlapPct"
            type="number"
            min="0"
            max="90"
            value="50"
            style="width: 60px"
          />
        </label>
        <label style="margin-left: 8px"
          >Stitch:
          <select id="stitchWindow" style="width: 80px">
            <option value="hann" selected>Hann</option>
            <option value="tri">Tri</option>
          </select>
        </label>
        <label style="margin-left: 8px"
          >Tile batch:
          <input
            id="tileBatch"
            type="number"
            min="1"
            max="8"
            value="3"
            style="width: 60px"
          />
        </label>
        <label style="margin-left: 8px"
          >Prefetch:
          <input
            id="prefetchDepth"
            type="number"
            min="1"
            max="8"
            value="2"
            style="width: 60px"
          />
        </label>
      </span>
      <span
        style="
          margin-left: 12px;
          border-left: 1px solid #ccc;
          padding-left: 12px;
        "
      >
        <label
          >A/B chunks (s):
          <input
            id="abA"
            type="number"
            min="2"
            max="60"
            value="10"
            style="width: 60px"
          />
          <input
            id="abB"
            type="number"
            min="2"
            max="60"
            value="30"
            style="width: 60px"
          />
        </label>
        <label style="margin-left: 8px"
          ><input id="abAlignHop" type="checkbox" /> Align hop (fair
          compare)</label
        >
        <button id="abBtn">Run A/B Compare</button>
      </span>
    </div>
    <pre id="log">Loading...</pre>
    <div id="stemsContainer" style="margin-top: 12px"></div>
    <div id="abContainer" style="margin-top: 12px">
      <div id="abAContainer"></div>
      <div id="abBContainer" style="margin-top: 12px"></div>
    </div>
    <script type="module">
      // import { createSpleeterWasm } from "./js/spleeter-wasm.js";
      import { resampleTo44100, decodeArrayBufferToPCM } from "./js/audio.js";
      import { float32ToWavMono } from "./js/wav.js";
      import { checkGPUSupport } from "./js/tf-backend.js";

      const logEl = document.getElementById("log");
      const verboseChk = document.getElementById("verboseChk");
      // Throttled logger with line cap to reduce reflow jank
      const MAX_LINES = 400;
      let logLines = ["Loading..."]; // initialize with existing content
      let logBuffer = [];
      let rafScheduled = false;
      const flushLogs = () => {
        if (logBuffer.length) {
          for (const m of logBuffer) logLines.push(m);
          if (logLines.length > MAX_LINES)
            logLines = logLines.slice(logLines.length - MAX_LINES);
          logEl.textContent = logLines.join("\n");
          logBuffer.length = 0;
        }
        rafScheduled = false;
      };
      const log = (m) => {
        logBuffer.push(m);
        if (!rafScheduled) {
          rafScheduled = true;
          requestAnimationFrame(flushLogs);
        }
      };
      const fileInput = document.getElementById("fileInput");
      const cancelBtn = document.getElementById("cancelBtn");
      const stemsSelect = document.getElementById("stemsSelect");
      const loadModelBtn = document.getElementById("loadModelBtn");
      const preloadAllBtn = document.getElementById("preloadAllBtn");
      const startBtn = document.getElementById("startBtn");
      const chunkSecInput = document.getElementById("chunkSec");
      const setIdealBtn = document.getElementById("setIdealBtn");

      const workerUrl = new URL("./js/worker.js", import.meta.url);
      const worker = new Worker(workerUrl, { type: "module" });
      log("Worker created (module)");
      // Probe GPU/WebGL support and update UI
      (async () => {
        try {
          const ok = await checkGPUSupport();
          const gpuEl = document.getElementById("gpuStatus");
          if (gpuEl)
            gpuEl.textContent = ok ? "GPU: WebGL available" : "GPU: CPU only";
          log(`[ui] GPU/WebGL available: ${ok ? "yes" : "no"}`);
          // Probe vendor/renderer
          try {
            const canvas = document.createElement("canvas");
            const gl =
              canvas.getContext("webgl2") || canvas.getContext("webgl");
            if (gl) {
              const dbgExt = gl.getExtension("WEBGL_debug_renderer_info");
              const vendor = dbgExt
                ? gl.getParameter(dbgExt.UNMASKED_VENDOR_WEBGL)
                : gl.getParameter(gl.VENDOR);
              const renderer = dbgExt
                ? gl.getParameter(dbgExt.UNMASKED_RENDERER_WEBGL)
                : gl.getParameter(gl.RENDERER);
              const glInfo = document.getElementById("glInfo");
              if (glInfo)
                glInfo.textContent = `GL: ${vendor} / ${renderer}`;
              log(`[ui] GL vendor/renderer: ${vendor} / ${renderer}`);
            }
          } catch (_) {}
        } catch (e) {
          const gpuEl = document.getElementById("gpuStatus");
          if (gpuEl) gpuEl.textContent = "GPU: probe failed";
          log("[ui] GPU probe failed");
        }
      })();
      worker.addEventListener("error", (ev) => {
        const where =
          ev && ev.filename
            ? `${ev.filename}:${ev.lineno || 0}:${ev.colno || 0}`
            : "";
        if (where) log(`Worker error at ${where}`);
        log(
          "Worker error: " + (ev?.message || ev?.error?.message || String(ev))
        );
        if (ev?.error?.stack) log(ev.error.stack);
        console.error("Worker error", ev);
      });
      worker.addEventListener("messageerror", (ev) => {
        log("Worker messageerror: " + String(ev?.data ?? ""));
        console.error("Worker messageerror", ev);
      });
      // Tiling settings helpers and query
      const getTilingSettingsFromUI = () => {
        const overlapPctEl = document.getElementById("overlapPct");
        const stitchEl = document.getElementById("stitchWindow");
        const tileBatchEl = document.getElementById("tileBatch");
        const prefetchEl = document.getElementById("prefetchDepth");
        const overlapPct = Math.max(
          0,
          Math.min(99, Number(overlapPctEl?.value) || 50)
        );
        const overlapFraction = overlapPct / 100;
        const stitchWindow = stitchEl?.value || "hann";
        const tileBatch = Math.max(
          1,
          Math.min(8, Number(tileBatchEl?.value) || 3)
        );
        const prefetchDepth = Math.max(
          1,
          Math.min(8, Number(prefetchEl?.value) || 2)
        );
        return { overlapFraction, stitchWindow, tileBatch, prefetchDepth };
      };
      const pushTilingSettings = () => {
        const s = getTilingSettingsFromUI();
        worker.postMessage({ type: "set-tiling-settings", payload: s });
      };
      // Query tiling info helper
      const queryTiling = () => {
        const stems = Number(stemsSelect.value) || 2;
        const chunkSize = Math.max(
          1,
          Math.floor(44100 * (Number(chunkSecInput.value) || 10))
        );
        worker.postMessage({
          type: "query-tiling",
          payload: {
            stems,
            sampleRate: 44100,
            chunkSize,
            tilingSettings: getTilingSettingsFromUI(),
          },
        });
      };
      // Backend control
      const forceCpuChk = document.getElementById("forceCpuChk");
      forceCpuChk.addEventListener("change", () => {
        const force = !!forceCpuChk.checked;
        worker.postMessage({
          type: "set-backend",
          payload: { preference: force ? "cpu" : "auto" },
        });
        log(`[ui] backend preference: ${force ? "cpu" : "auto"}`);
      });
      // Simple event-loop lag monitor
      let lastTick = performance.now();
      setInterval(() => {
        const now = performance.now();
        const lag = now - lastTick - 1000;
        if (lag > 50 && verboseChk.checked)
          log(`[ui] event-loop lag ~${lag.toFixed(1)}ms`);
        lastTick = now;
      }, 1000);

      // Batch progress updates to reduce UI churn
      let pendingProgress = null;
      let progressRAF = false;
      const flushProgress = () => {
        if (!pendingProgress) return;
        const p = pendingProgress;
        pendingProgress = null;
        log(
          `Chunk ${p.index}/${p.total} [${p.start}, ${
            p.end
          }) durationMs=${p.durationMs.toFixed(2)}ms`
        );
        progressRAF = false;
      };

      // A/B compare state
      const abState = { active: false, tags: {}, results: {} };
      // Manage stem players
      let currentStemURLs = [];
      const clearStemPlayers = () => {
        try {
          currentStemURLs.forEach((u) => URL.revokeObjectURL(u));
        } catch (_) {}
        currentStemURLs = [];
        const cont = document.getElementById("stemsContainer");
        if (cont) cont.innerHTML = "";
      };
      const drawWaveform = (canvas, data) => {
        const w = (canvas.width = Math.min(
          800,
          Math.max(300, canvas.clientWidth || 600)
        ));
        const h = (canvas.height = 60);
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#f5f5f5";
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "#333";
        ctx.lineWidth = 1;
        ctx.beginPath();
        const n = data.length;
        const samplesPerPx = Math.max(1, Math.floor(n / w));
        const mid = h / 2;
        for (let x = 0; x < w; x++) {
          const start = x * samplesPerPx;
          const end = Math.min(n, start + samplesPerPx);
          let min = 1.0,
            max = -1.0;
          for (let i = start; i < end; i++) {
            const v = data[i];
            if (v < min) min = v;
            if (v > max) max = v;
          }
          const y1 = mid - Math.max(-1, Math.min(1, max)) * (h / 2 - 2);
          const y2 = mid - Math.max(-1, Math.min(1, min)) * (h / 2 - 2);
          ctx.moveTo(x + 0.5, y1);
          ctx.lineTo(x + 0.5, y2);
        }
        ctx.stroke();
      };

      const renderStems = (payload, targetId) => {
        const cont = document.getElementById("stemsContainer");
        if (!cont) return;
        if (!targetId) clearStemPlayers();
        const stems = payload?.stems || [];
        const sr = payload?.sampleRate || 44100;
        const num = stems.length;
        const namesByCount = {
          2: ["vocals", "accompaniment"],
          4: ["vocals", "drums", "bass", "other"],
          5: ["vocals", "drums", "bass", "piano", "other"],
        };
        const stemNames =
          namesByCount[num] || stems.map((_, i) => `stem${i + 1}`);
        const target = targetId ? document.getElementById(targetId) : cont;
        const section = document.createElement("div");
        section.style.border = "1px solid #ddd";
        section.style.padding = "8px";
        section.style.marginTop = "8px";
        if (payload?.tag) {
          const h = document.createElement("div");
          h.textContent = `Result ${payload.tag}`;
          h.style.fontWeight = "600";
          h.style.marginBottom = "4px";
          section.appendChild(h);
        }
        stems.forEach((data, idx) => {
          const blob = float32ToWavMono(data, sr);
          const url = URL.createObjectURL(blob);
          currentStemURLs.push(url);
          const wrap = document.createElement("div");
          wrap.style.marginTop = "6px";
          const label = document.createElement("div");
          label.textContent = `${stemNames[idx] || `stem${idx + 1}`}`;
          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = url;
          audio.style.display = "block";
          audio.style.width = "100%";
          const canvas = document.createElement("canvas");
          canvas.style.display = "block";
          canvas.style.width = "100%";
          canvas.style.height = "60px";
          drawWaveform(canvas, data);
          const a = document.createElement("a");
          a.href = url;
          a.download = `${stemNames[idx] || `stem${idx + 1}`}${
            payload?.tag ? `_${payload.tag}` : ""
          }.wav`;
          `stem${idx + 1}.wav` + (payload?.tag ? `_${payload.tag}` : "");
          a.textContent = "Download";
          a.style.display = "inline-block";
          a.style.marginTop = "2px";
          wrap.appendChild(label);
          wrap.appendChild(audio);
          wrap.appendChild(canvas);
          wrap.appendChild(a);
          section.appendChild(wrap);
        });
        target.appendChild(section);
      };

      worker.onmessage = async (e) => {
        const { type, payload } = e.data || {};
        if (type === "worker-ready") {
          log("Worker ready");
          return;
        }
        if (type === "backend-set") {
          const { backend } = payload || {};
          if (backend) {
            const be = document.getElementById("backendStatus");
            if (be) be.textContent = `Backend: ${backend}`;
            log(`[worker] backend set to ${backend}`);
          }
          return;
        }
        if (type === "debug") {
          if (verboseChk.checked && payload?.message)
            log(`[worker] ${payload.message}`);
          return;
        }
        if (type === "tiling-info") {
          const p = payload || {};
          const secs = (p.windowSeconds || 0).toFixed(2);
          const tiles = p.tilesForChunk || 1;
          const ov =
            p.overlap != null
              ? `, overlap=${Math.round(p.overlap * 100)}%`
              : "";
          const tb = p.settings?.tileBatch
            ? `, tileBatch=${p.settings.tileBatch}`
            : "";
          const info = `Window: ${p.windowSamples} samples (~${secs}s) [${p.framesSpan}×${p.hopSamples}], tiles for chunk: ${tiles}${ov}${tb}`;
          const wi = document.getElementById("windowInfo");
          if (wi) wi.textContent = info;
          log(info);
          return;
        }
        if (type === "batch-auto-selected") {
          const k = payload?.k;
          const results = payload?.results || [];
          const summary = results
            .map(
              (r) =>
                `${r.k}:${r.ok ? r.msPerChunk.toFixed(2) + "ms/chunk" : "fail"}`
            )
            .join("  ");
          log(`Auto batch: selected k=${k} | ${summary}`);
          return;
        }
        if (type === "model-loading") {
          log(`Loading model for ${payload.stems} stems...`);
        } else if (type === "preload-start") {
          log("Preloading models...");
        } else if (type === "processing-start") {
          log(
            `Processing: frames=${payload.frames}, chunk=${payload.chunkSize}, hop=${payload.hopSize}, stems=${payload.numStems}` +
              (payload?.tag ? ` [tag=${payload.tag}]` : "")
          );
        } else if (type === "planned") {
          cancelBtn.disabled = false;
          log(
            `Planned ${payload.total} chunks...` +
              (payload?.tag ? ` [tag=${payload.tag}]` : "")
          );
        } else if (type === "progress") {
          pendingProgress = payload;
          if (!progressRAF) {
            progressRAF = true;
            requestAnimationFrame(flushProgress);
          }
        } else if (type === "cancelled") {
          if (payload?.recon) {
            const r = payload.recon;
            log(
              `Recon error: rmsDiff=${r.rmsDiff.toExponential(
                3
              )} (${r.relPct.toFixed(2)}% of input rms ${r.rmsMix.toExponential(
                3
              )})`
            );
          }
          cancelBtn.disabled = true;
          log("Cancelled");
        } else if (type === "done") {
          cancelBtn.disabled = true;
          log("Done" + (payload?.tag ? ` [tag=${payload.tag}]` : ""));
          // Normal run: render into main container
          renderStems(payload, null);
          if (payload?.backend) {
            log(`Backend used: ${payload.backend}`);
            const be = document.getElementById("backendStatus");
            if (be) be.textContent = `Backend: ${payload.backend}`;
          }
          if (payload?.totalMs != null) {
            const sec = (payload.totalMs / 1000).toFixed(2);
            log(`Total: ${sec}s end-to-end`);
          }
          if (payload?.stats) {
            payload.stats.forEach((s, i) =>
              log(
                `Stem ${i + 1}: len=${s.len} min=${s.min.toFixed(
                  4
                )} max=${s.max.toFixed(4)} rms=${s.rms.toFixed(6)} nz=${(
                  s.nzFrac * 100
                ).toFixed(2)}%`
              )
            );
          }
          // If A/B active, collect and compare when both arrive
          if (
            abState.active &&
            payload?.tag &&
            (payload.tag === "A" || payload.tag === "B")
          ) {
            abState.results[payload.tag] = payload;
            if (abState.results.A && abState.results.B) {
              const A = abState.results.A;
              const B = abState.results.B;
              const stemsA = A.stems || [];
              const stemsB = B.stems || [];
              const n = Math.min(stemsA.length, stemsB.length);
              log(`A/B compare: stems=${n}`);
              for (let i = 0; i < n; i++) {
                const a = stemsA[i];
                const b = stemsB[i];
                const len = Math.min(a.length, b.length);
                let sumSq = 0;
                let sumSqA = 0;
                let sumSqB = 0;
                const stride = len > 200000 ? Math.ceil(len / 200000) : 1;
                for (let j = 0; j < len; j += stride) {
                  const da = a[j];
                  const db = b[j];
                  const d = da - db;
                  sumSq += d * d;
                  sumSqA += da * da;
                  sumSqB += db * db;
                }
                const rmsDiff = Math.sqrt(
                  sumSq / Math.max(1, Math.ceil(len / stride))
                );
                const rmsA = Math.sqrt(
                  sumSqA / Math.max(1, Math.ceil(len / stride))
                );
                const rmsB = Math.sqrt(
                  sumSqB / Math.max(1, Math.ceil(len / stride))
                );
                const relA = rmsA > 1e-9 ? (rmsDiff / rmsA) * 100 : 0;
                const relB = rmsB > 1e-9 ? (rmsDiff / rmsB) * 100 : 0;
                log(
                  `Stem ${i + 1} RMS diff: ${rmsDiff.toExponential(
                    3
                  )} (${relA.toFixed(2)}% of A, ${relB.toFixed(2)}% of B)`
                );
              }
              if (A.recon || B.recon) {
                const ra = A.recon;
                const rb = B.recon;
                if (ra)
                  log(
                    `A recon: rmsDiff=${ra.rmsDiff.toExponential(
                      3
                    )} (${ra.relPct.toFixed(2)}% of input)`
                  );
                if (rb)
                  log(
                    `B recon: rmsDiff=${rb.rmsDiff.toExponential(
                      3
                    )} (${rb.relPct.toFixed(2)}% of input)`
                  );
              }
              log(
                `A time: ${(A.totalMs / 1000).toFixed(2)}s, B time: ${(
                  B.totalMs / 1000
                ).toFixed(2)}s`
              );
              if (A.backend || B.backend) {
                log(
                  `A backend: ${A.backend || "?"}, B backend: ${
                    B.backend || "?"
                  }`
                );
              }
              // Render A and B into their dedicated containers with waveforms and downloads
              const abACont = document.getElementById("abAContainer");
              const abBCont = document.getElementById("abBContainer");
              if (abACont) abACont.innerHTML = "";
              if (abBCont) abBCont.innerHTML = "";
              renderStems(A, "abAContainer");
              renderStems(B, "abBContainer");
              abState.active = false;
              abState.results = {};
            }
          }
          // Auto play - only if we have to
          // Quick listen: play first stem mono
          // try {
          //   if (payload && payload.stems && payload.stems.length) {
          //     const ctx = new (window.AudioContext ||
          //       window.webkitAudioContext)();
          //     if (ctx.state === "suspended") await ctx.resume();
          //     const data = payload.stems[1];
          //     const nonZero = data.some((v) => v !== 0);
          //     log(`First stem preview: len=${data.length} nonZero=${nonZero}`);
          //     let playData = data;
          //     if (!nonZero && data.length > 0) {
          //       // synthesize a short blip so we know playback works
          //       const L = Math.min(4410, data.length); // 0.1s
          //       playData = new Float32Array(data.length);
          //       for (let i = 0; i < L; i++)
          //         playData[i] = Math.sin((i / L) * Math.PI);
          //     }
          //     const buffer = ctx.createBuffer(
          //       1,
          //       playData.length,
          //       payload.sampleRate || 44100
          //     );
          //     buffer.copyToChannel(playData, 0, 0);
          //     const src = ctx.createBufferSource();
          //     src.buffer = buffer;
          //     src.connect(ctx.destination);
          //     src.start();
          //   }
          // } catch (err) {
          //   console.warn("Playback error", err);
          // }
        } else if (type === "model-loaded") {
          const { stems, info, ioDetail } = payload;
          log(`Model loaded: ${stems} stems @ ${info.backend}`);
          if (info.url) log(`URL: ${info.url}`);
          if (info.io && (info.io.inputs?.length || info.io.outputs?.length)) {
            log(
              `IO: inputs=[${info.io.inputs.join(
                ", "
              )}], outputs=[${info.io.outputs.join(", ")}]`
            );
          }
          if (ioDetail) {
            const ins = (ioDetail.inputs || [])
              .map((t) => `${t.name}:{${t.dtype}}${JSON.stringify(t.shape)}`)
              .join(", ");
            const outs = (ioDetail.outputs || [])
              .map((t) => `${t.name}:{${t.dtype}}${JSON.stringify(t.shape)}`)
              .join(", ");
            log(`IO detail: inputs=[${ins}]`);
            log(`IO detail: outputs=[${outs}]`);
          }
          // Query tiling once the model is ready
          queryTiling();
        } else if (type === "model-progress") {
          log(
            `Preload ${payload.index}/${payload.total}: ${
              payload.stems
            } stems ${payload.ok ? "OK" : "FAIL"}`
          );
        } else if (type === "webgl-tuning-set") {
          const { backend, opts } = payload || {};
          log(
            `WebGL tuning applied (${JSON.stringify(
              opts
            )}); backend=${backend}`
          );
        } else if (type === "models-preloaded") {
          const okCount = (payload.results || []).filter((r) => r.ok).length;
          log(
            `Preload complete: ${okCount}/${payload.results.length} models loaded`
          );
        } else if (type === "error") {
          cancelBtn.disabled = true;
          if (payload?.site) log(`Error at ${payload.site}`);
          log(
            "Error: " +
              payload.message +
              (payload?.tag ? ` [tag=${payload.tag}]` : "")
          );
          if (payload?.context) log(`Context: ${payload.context}`);
          if (payload?.stack) log(payload.stack);
          clearStemPlayers();
        }
      };
      // Run A/B compare: runs two process-audio with different chunk sizes and compares RMS
      const abBtn = document.getElementById("abBtn");
      abBtn.onclick = async () => {
        const f = fileInput.files && fileInput.files[0];
        if (!f) {
          log("Select a file first for A/B compare");
          return;
        }
        const abA = Math.max(
          2,
          Math.min(60, Number(document.getElementById("abA").value) || 10)
        );
        const abB = Math.max(
          2,
          Math.min(60, Number(document.getElementById("abB").value) || 20)
        );
        log(`A/B: A=${abA}s, B=${abB}s`);
        // Reuse already decoded+resampled audio if available by caching it on window
        if (!window._lastPCM || window._lastPCMFile !== f) {
          const abuf = await f.arrayBuffer();
          const pcm = await decodeArrayBufferToPCM(abuf);
          window._lastPCM = await resampleTo44100(pcm);
          window._lastPCMFile = f;
        }
        const resampled = window._lastPCM;
        const frames = resampled.channels?.[0]?.length || 0;
        const stems = Number(stemsSelect.value);
        const progressIntervalMs =
          Number(document.getElementById("progressMs").value) || 250;
        const batchSize = document.getElementById("batchSize").value || "1";
        abState.active = true;
        abState.results = {};
        // Kick A then B
        const send = (tag, chunkSec) => {
          const chunkSize = Math.max(1, Math.floor(44100 * chunkSec));
          const alignHop = !!document.getElementById("abAlignHop").checked;
          const ov = getTilingSettingsFromUI().overlapFraction;
          const baseHop = alignHop
            ? Math.floor(44100 * Math.min(abA, abB))
            : chunkSize;
          const hopSize = Math.max(1, Math.floor(baseHop * (1 - ov)));
          worker.postMessage({
            type: "process-audio",
            payload: {
              tag,
              sampleRate: 44100,
              frames,
              chunkSize,
              hopSize,
              channels: resampled.channels,
              numStems: stems,
              progressIntervalMs,
              batchSize,
              tilingSettings: getTilingSettingsFromUI(),
            },
          });
        };
        send("A", abA);
        send("B", abB);
      };

      loadModelBtn.onclick = () => {
        log("Load Model clicked");
        const stems = Number(stemsSelect.value);
        worker.postMessage({ type: "load-model", payload: { stems } });
      };
      stemsSelect.onchange = () => {
        pushTilingSettings();
        queryTiling();
      };
      chunkSecInput.onchange = () => {
        pushTilingSettings();
        queryTiling();
      };
      const overlapPctEl = document.getElementById("overlapPct");
      if (overlapPctEl)
        overlapPctEl.onchange = () => {
          pushTilingSettings();
          queryTiling();
        };
      const stitchEl = document.getElementById("stitchWindow");
      if (stitchEl)
        stitchEl.onchange = () => {
          pushTilingSettings();
          queryTiling();
        };
      const tileBatchEl = document.getElementById("tileBatch");
      if (tileBatchEl)
        tileBatchEl.onchange = () => {
          pushTilingSettings();
        };
      const prefetchEl = document.getElementById("prefetchDepth");
      if (prefetchEl)
        prefetchEl.onchange = () => {
          pushTilingSettings();
        };
      setIdealBtn.onclick = () => {
        const wi = document.getElementById("windowInfo");
        const text = wi?.textContent || "";
        const m = text.match(/~([0-9]+\.[0-9]+)s/);
        if (m) {
          const ideal = parseFloat(m[1]);
          if (!isNaN(ideal)) {
            chunkSecInput.value = ideal.toFixed(2);
            log(`Set chunk to ideal ~${ideal.toFixed(2)}s`);
            queryTiling();
          }
        } else {
          log("Ideal window not available yet; load a model first.");
        }
      };
      preloadAllBtn.onclick = () => {
        log("Preload All clicked");
        worker.postMessage({
          type: "preload-all-models",
          payload: { stemsList: [2, 4, 5] },
        });
      };

      // Apply WebGL tuning flags
      const applyTuningBtn = document.getElementById("applyTuningBtn");
      const webglTuning = document.getElementById("webglTuning");
      if (applyTuningBtn && webglTuning) {
        applyTuningBtn.onclick = () => {
          const sel = webglTuning.value;
          let opts = {};
          if (sel === "v2_pack") opts = { webglVersion: 2, pack: true };
          else if (sel === "v2_f16")
            opts = { webglVersion: 2, pack: true, forceF16: true };
          else if (sel === "v1_pack") opts = { webglVersion: 1, pack: true };
          else opts = {};
          log(`[ui] apply WebGL tuning: ${JSON.stringify(opts)}`);
          worker.postMessage({ type: "set-webgl-tuning", payload: opts });
        };
      }

      // Verbose toggle: inform worker to enable/disable debug messages
      verboseChk.onchange = () => {
        const verbose = !!verboseChk.checked;
        worker.postMessage({ type: "set-verbose", payload: { verbose } });
        log(`[ui] verbose=${verbose}`);
      };

      cancelBtn.onclick = () => worker.postMessage({ type: "cancel" });

      try {
        // const api = await createSpleeterWasm({
        //   moduleUrl: "/wasm/spleeter.js",
        // });
        // log("Module loaded");
        // const v = await api.version();
        // log(`sp_version: ${v}`);
        // const rc = await api.init({ sampleRate: 44100, channels: 2 });
        // log(`sp_init rc=${rc}`);

        fileInput.onchange = async () => {
          const f = fileInput.files && fileInput.files[0];
          if (!f) return;
          log(`Selected: ${f.name}`);
          const ab = await f.arrayBuffer();
          const pcm = await decodeArrayBufferToPCM(ab);
          const resampled = await resampleTo44100(pcm);
          // Cache for later processing
          window._lastPCM = resampled;
          window._lastPCMFile = f;
          startBtn.disabled = false;
          // Log input stats
          const statsCh = (arr) => {
            const n = arr.length;
            const maxSamples = 200000;
            const stride = n > maxSamples ? Math.ceil(n / maxSamples) : 1;
            let min = Infinity,
              max = -Infinity,
              sumSq = 0,
              nz = 0,
              count = 0;
            for (let i = 0; i < n; i += stride) {
              const v = arr[i];
              if (v < min) min = v;
              if (v > max) max = v;
              sumSq += v * v;
              if (v !== 0) nz++;
              count++;
            }
            const rms = Math.sqrt(sumSq / Math.max(1, count));
            const nzFrac = count ? nz / count : 0;
            return { len: n, min, max, rms, nzFrac };
          };
          const ch0 = resampled.channels?.[0];
          if (ch0) {
            const s0 = statsCh(ch0);
            log(
              `Input Ch1: len=${s0.len} min=${s0.min.toFixed(
                4
              )} max=${s0.max.toFixed(4)} rms=${s0.rms.toFixed(6)} nz=${(
                s0.nzFrac * 100
              ).toFixed(2)}%`
            );
          }
          const ch1 = resampled.channels?.[1];
          if (ch1) {
            const s1 = statsCh(ch1);
            log(
              `Input Ch2: len=${s1.len} min=${s1.min.toFixed(
                4
              )} max=${s1.max.toFixed(4)} rms=${s1.rms.toFixed(6)} nz=${(
                s1.nzFrac * 100
              ).toFixed(2)}%`
            );
          }
          log("Ready. Click 'Start Separation' to run.");
        };

        // Start processing using cached audio and current UI settings
        startBtn.onclick = async () => {
          const f = fileInput.files && fileInput.files[0];
          if (!f) {
            log("Select a file first.");
            return;
          }
          if (!window._lastPCM || window._lastPCMFile !== f) {
            const ab = await f.arrayBuffer();
            const pcm = await decodeArrayBufferToPCM(ab);
            window._lastPCM = await resampleTo44100(pcm);
            window._lastPCMFile = f;
          }
          const resampled = window._lastPCM;
          const frames = resampled.channels?.[0]?.length || 0;
          const chunkSec =
            Number(document.getElementById("chunkSec").value) || 10;
          const chunkSize = Math.max(1, Math.floor(44100 * chunkSec));
          const ov = getTilingSettingsFromUI().overlapFraction;
          const hopSize = Math.max(1, Math.floor(chunkSize * (1 - ov)));
          const stems = Number(stemsSelect.value);
          const progressIntervalMs =
            Number(document.getElementById("progressMs").value) || 250;
          const batchSize = document.getElementById("batchSize").value || "1";
          worker.postMessage({
            type: "process-audio",
            payload: {
              sampleRate: 44100,
              frames,
              chunkSize,
              hopSize,
              channels: resampled.channels,
              numStems: stems,
              progressIntervalMs,
              batchSize,
              tilingSettings: getTilingSettingsFromUI(),
            },
          });
        };
      } catch (e) {
        log("Error: " + (e && e.message ? e.message : e));
        console.error(e);
      }
    </script>
  </body>
</html>
