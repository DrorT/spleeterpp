<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spleeter WASM Smoke Test</title>
  </head>
  <body>
    <h1>Spleeter WASM Smoke Test</h1>
    <div>
      <input id="fileInput" type="file" accept="audio/*" />
      <button id="cancelBtn" disabled>Cancel</button>
    </div>
    <div style="margin-top: 8px">
      <label for="stemsSelect">Stems:</label>
      <select id="stemsSelect">
        <option value="2" selected>2 stems</option>
        <option value="4">4 stems</option>
        <option value="5">5 stems</option>
      </select>
      <button id="loadModelBtn">Load Model</button>
      <button id="preloadAllBtn">Preload All</button>
    </div>
    <pre id="log">Loading...</pre>
    <script type="module">
      import { createSpleeterWasm } from "./js/spleeter-wasm.js";
      import { resampleTo44100, decodeArrayBufferToPCM } from "./js/audio.js";

      const logEl = document.getElementById("log");
      const log = (m) => (logEl.textContent += `\n${m}`);
      const fileInput = document.getElementById("fileInput");
      const cancelBtn = document.getElementById("cancelBtn");
      const stemsSelect = document.getElementById("stemsSelect");
      const loadModelBtn = document.getElementById("loadModelBtn");
      const preloadAllBtn = document.getElementById("preloadAllBtn");

      const worker = new Worker("./js/worker.js", { type: "module" });
      worker.onmessage = async (e) => {
        const { type, payload } = e.data || {};
        if (type === "planned") {
          cancelBtn.disabled = false;
          log(`Planned ${payload.total} chunks...`);
        } else if (type === "progress") {
          log(
            `Chunk ${payload.index}/${payload.total} [${payload.start}, ${payload.end})`
          );
        } else if (type === "cancelled") {
          cancelBtn.disabled = true;
          log("Cancelled");
        } else if (type === "done") {
          cancelBtn.disabled = true;
          log("Done");
          // Quick listen: play first stem mono
          try {
            if (payload && payload.stems && payload.stems.length) {
              const ctx = new (window.AudioContext ||
                window.webkitAudioContext)();
              const data = payload.stems[0];
              const buffer = ctx.createBuffer(
                1,
                data.length,
                payload.sampleRate || 44100
              );
              buffer.copyToChannel(data, 0, 0);
              const src = ctx.createBufferSource();
              src.buffer = buffer;
              src.connect(ctx.destination);
              src.start();
            }
          } catch (err) {
            console.warn("Playback error", err);
          }
        } else if (type === "model-loaded") {
          const { stems, info } = payload;
          log(`Model loaded: ${stems} stems @ ${info.backend}`);
          if (info.url) log(`URL: ${info.url}`);
          if (info.io && (info.io.inputs?.length || info.io.outputs?.length)) {
            log(
              `IO: inputs=[${info.io.inputs.join(
                ", "
              )}], outputs=[${info.io.outputs.join(", ")}]`
            );
          }
        } else if (type === "model-progress") {
          log(
            `Preload ${payload.index}/${payload.total}: ${
              payload.stems
            } stems ${payload.ok ? "OK" : "FAIL"}`
          );
        } else if (type === "models-preloaded") {
          const okCount = (payload.results || []).filter((r) => r.ok).length;
          log(
            `Preload complete: ${okCount}/${payload.results.length} models loaded`
          );
        } else if (type === "error") {
          cancelBtn.disabled = true;
          log("Error: " + payload.message);
        }
      };

      loadModelBtn.onclick = () => {
        const stems = Number(stemsSelect.value);
        worker.postMessage({ type: "load-model", payload: { stems } });
      };
      preloadAllBtn.onclick = () => {
        worker.postMessage({
          type: "preload-all-models",
          payload: { stemsList: [2, 4, 5] },
        });
      };

      cancelBtn.onclick = () => worker.postMessage({ type: "cancel" });

      try {
        const api = await createSpleeterWasm({
          moduleUrl: "/wasm/spleeter.js",
        });
        log("Module loaded");
        const v = await api.version();
        log(`sp_version: ${v}`);
        const rc = await api.init({ sampleRate: 44100, channels: 2 });
        log(`sp_init rc=${rc}`);

        fileInput.onchange = async () => {
          const f = fileInput.files && fileInput.files[0];
          if (!f) return;
          log(`Selected: ${f.name}`);
          const ab = await f.arrayBuffer();
          const pcm = await decodeArrayBufferToPCM(ab);
          const resampled = await resampleTo44100(pcm);
          const frames = resampled.channels?.[0]?.length || 0;
          const chunkSize = 44100 * 10; // 10s chunk
          const hopSize = 44100 * 5; // 50% overlap
          const stems = Number(stemsSelect.value);
          worker.postMessage({
            type: "process-audio",
            payload: {
              sampleRate: 44100,
              frames,
              chunkSize,
              hopSize,
              channels: resampled.channels,
              numStems: stems,
            },
          });
        };
      } catch (e) {
        log("Error: " + (e && e.message ? e.message : e));
        console.error(e);
      }
    </script>
  </body>
</html>
